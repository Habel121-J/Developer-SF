<!-- sldsValidatorIgnore -->
<template>
    <lightning-card title="Custom Metadata Editor" icon-name="standard:opportunity">
        <lightning-layout>
            <lightning-layout-item>
                <lightning-combobox name="Metadata Type" required label="Metadata Type" placeholder="Select Metadata Type"
                    options={metaOptions} onchange={handleChange} style="width: 400px;">
                </lightning-combobox>
            </lightning-layout-item>
            <lightning-layout-item>
                <lightning-button style="padding-top: 2%;padding-left: 300px" variant="neutral" label="Create New"
                    title="Create New" onclick={handleCreateButton} class="slds-m-left_x-small"></lightning-button>
            </lightning-layout-item>
        </lightning-layout>
        <br>
        <lightning-datatable key-field="Id" data={tableData} hide-checkbox-column show-row-number-column
            row-number-offset={rowOffset} draft-values={draftValues} onsave={handleSave} columns={columns}>
        </lightning-datatable>
        <br>

        <lightning-button-group>
            <!-- <lightning-button  variant="brand" onclick={handleSave} label="Save" class="slds-m-left_x-small"></lightning-button> -->
            <!-- <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-left_x-small"></lightning-button> -->

        </lightning-button-group>
        <template if:true={isShowModal}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- modal header start -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={hideModalBox}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                                size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                    </header>

                    <!-- modal body start -->
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        <lightning-layout class="slds-grid slds-wrap" horizontal-aling="spread">
                            <template for:each={inputCols} for:item="input">
                                <lightning-layout-item size="6" class="slds-col slds-size_6-of-12" key={Cols} padding="around-small">
                                    <lightning-input data-field={input.fieldName} type={input.type} label={input.label} required={input.required} onchange={handleInputChange}></lightning-input>
                                </lightning-layout-item>
                            </template>
                        </lightning-layout>                       
                    </div>

                    <!-- modal footer start-->
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                        <button class="slds-button slds-button_brand" onclick={handleCreateNew}>Save</button>
                    </footer>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <!-- modal end -->
    </lightning-card>

</template>
